name: animal_moves
description: "動物動一動：2～5 歲跟著動物動身體的 APP。"
publish_to: 'none'

# The version (also in lib/app/version.dart and CHANGELOG.md; test/version_test.dart checks they agree).
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  flutter_tts: ^4.2.5
  go_router: ^18.1.1
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/art/moves/
    - assets/art/kids/
    - assets/art/guides/
    - assets/art/scenes/
    - assets/art/safety/
    - assets/art/ui/
  fonts:
    - family: Huninn
      fonts:
        - asset: assets/fonts/jf-openhuninn-2.1.ttf
